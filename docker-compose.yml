services:
  postgres:
    image: postgres:16-alpine
    container_name: circuit-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-circuit}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-circuit_vault_secure_pwd_2026}
      - POSTGRES_DB=${POSTGRES_DB:-circuit_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - circuit-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-circuit} -d ${POSTGRES_DB:-circuit_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: circuit-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-circuit}:${POSTGRES_PASSWORD:-circuit_vault_secure_pwd_2026}@postgres:5432/${POSTGRES_DB:-circuit_db}}
      - JWT_SECRET=${JWT_SECRET}
      - BIOMETRIC_ENCRYPTION_KEY=${BIOMETRIC_ENCRYPTION_KEY}
      - BIOMETRIC_ENABLED=${BIOMETRIC_ENABLED:-true}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080,http://localhost:3000,http://localhost:80}
      - ML_ENGINE_URL=http://ml-engine:8001
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - circuit-net

  ml-engine:
    build:
      context: ./services/ml-engine
      dockerfile: Dockerfile
    container_name: circuit-ml-engine
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-ml-secure-internal-key-2026}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - circuit-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: circuit-frontend
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_URL=http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - circuit-net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: circuit-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
      - ml-engine
    networks:
      - circuit-net

volumes:
  postgres_data:
    driver: local

networks:
  circuit-net:
    driver: bridge
